name: CI

# Matches the Git workflow in the deploy sheet: feature branches and PRs
# get validated before merge to main, which is what Coolify deploys from.
# This is exactly the check that would have caught the missing-import bug
# that broke `pnpm run typecheck` on a prior commit to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspace packages)
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build operator console
        run: pnpm --filter @workspace/leadsprint run build
        env:
          PORT: "5000"
          BASE_PATH: "/"
